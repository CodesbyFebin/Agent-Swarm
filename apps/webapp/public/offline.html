<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentSwarm - Offline</title>
    <link rel="manifest" href="/manifest.json">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
            text-align: center;
            padding: 2rem;
        }
        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #8b5cf6, #6478ff);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }
        .logo i {
            width: 20px;
            height: 2px;
            background: white;
            margin: 2px 0;
        }
        .logo i:nth-child(2) {
            width: 16px;
            margin: 3px 0;
        }
        .logo i:nth-child(3) {
            width: 12px;
            margin: 4px 0;
        }
        h1 {
            color: #333;
            margin-bottom: 1rem;
        }
        p {
            color: #666;
            line-height: 1.6;
            max-width: 500px;
        }
        .refresh-btn {
            margin-top: 2rem;
            padding: 0.75rem 1.5rem;
            background: #8b5cf6;
            color: white;
            border: none;
            border-radius: 0.5rem;
            font-size: 1rem;
            cursor: pointer;
        }
        .refresh-btn:hover {
            background: #7c3aed;
        }
    </style>
</head>
<body>
    <div class="logo">
        <i></i><i></i><i></i><i></i>
    </div>
    <h1>AgentSwarm</h1>
    <p>You're currently offline. Some features may not be available until you reconnect.</p>
    <p>The AgentSwarm Command Centre requires an internet connection to communicate with the AI workforce control plane.</p>
    <button class="refresh-btn" onclick="window.location.reload()">Try Again</button>

    <script>
        // Automatically try to reload when online
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
