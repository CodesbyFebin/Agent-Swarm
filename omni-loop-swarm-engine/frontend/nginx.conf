server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: any path that isn't a real file falls back to index.html so
    # client-side routing (and hard-refreshes on a sub-path) both work.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are safe to cache aggressively; index.html itself
    # is left out so a new deploy is picked up on next load.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
