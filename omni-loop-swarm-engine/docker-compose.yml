services:
  backend:
    build: .
    container_name: omni-loop-backend
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      FLASK_DEBUG: "false"
      CORS_ALLOW_ORIGIN: "*"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      args:
        # The browser (not the frontend container) makes API calls, so this
        # must be an address reachable from the host machine -- the
        # container-network hostname `backend` would only work for
        # server-to-server calls, which this app doesn't make.
        VITE_API_BASE: http://localhost:5000
    container_name: omni-loop-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
