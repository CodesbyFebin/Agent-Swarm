services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agentswarm
      POSTGRES_PASSWORD: agentswarm
      POSTGRES_DB: agentswarm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentswarm -d agentswarm"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - agentswarm_pg:/var/lib/postgresql/data

volumes:
  agentswarm_pg:
